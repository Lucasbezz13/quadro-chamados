<style>
  :root{
    --indigo:#2B3163; --indigo-2:#3B4380; --green:#2E8B4F; --green-l:#E7F4EA;
    --gold:#F5C242; --gold-l:#FDF3D9; --red:#C0392B; --red-l:#FBE7E4;
    --gray:#8B8FA3; --gray-l:#EEEFF3; --ink:#22243A; --paper:#F6F6F9;
    --card:#FFFFFF; --line:#E3E4EC;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  button, .btn{-webkit-touch-callout:none; -webkit-user-select:none; user-select:none;}
  html{scroll-padding-top:env(safe-area-inset-top, 0px);}
  html,body{margin:0; padding:0; background:var(--paper); color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif; height:100%;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--paper);}

  /* HEADER */
  header{background:var(--indigo); color:#fff; padding:calc(14px + env(safe-area-inset-top, 0px)) 16px 0 16px; position:sticky; top:0; z-index:20;}
  .brand-row{display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px; letter-spacing:.2px;}
  .brand-logo{height:26px; width:auto; display:block; border-radius:3px; background:#fff; padding:2px 4px;}
  .brand-text{display:flex; align-items:baseline; gap:3px;}
  .brand b{color:var(--gold);}
  .brand span.sub{font-weight:400; font-size:11.5px; color:#C7CAE0; margin-left:2px;}
  .gear-btn{background:rgba(255,255,255,.1); border:none; width:32px; height:32px; border-radius:9px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto; position:relative;}
  .gear-btn:active{opacity:.7;}
  .gear-dot{position:absolute; top:2px; right:2px; width:9px; height:9px; border-radius:50%; background:var(--red);
    border:1.5px solid var(--indigo); display:none;}
  .gear-dot.show{display:block;}
  .summary-row{display:flex; gap:8px; margin:10px 0 12px 0; overflow-x:auto; padding-bottom:2px;}
  .summary-row::-webkit-scrollbar{display:none;}
  .pill{flex:0 0 auto; padding:6px 11px; border-radius:20px; font-size:12.5px; font-weight:600;
    background:rgba(255,255,255,.08); color:#D6D8EA; border:1px solid rgba(255,255,255,.12); white-space:nowrap;}
  .pill b{color:#fff; font-weight:700;}

  /* TIPOS (Apartamentos / Áreas Comuns) */
  .tipos{display:flex; gap:6px; margin:2px 0 10px 0;}
  .tipo-btn{flex:1; text-align:center; padding:8px 6px; border-radius:9px; font-size:12.5px; font-weight:700;
    background:rgba(255,255,255,.07); color:#B7BAD4; border:1px solid rgba(255,255,255,.1); cursor:pointer;}
  .tipo-btn.active{background:var(--gold); color:var(--indigo);}

  /* TABS */
  .tabs{display:flex; gap:2px; padding:0 10px; overflow-x:auto;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto; padding:10px 13px 12px 13px; font-size:13px; font-weight:600; color:#AEB2CC;
    border-bottom:3px solid transparent; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:6px;}
  .tab .n{font-size:11px; font-weight:700; background:rgba(255,255,255,.1); color:#fff; border-radius:10px; padding:1px 6px;}
  .tab.active{color:#fff; border-bottom-color:var(--gold);}
  .tab.active .n{background:var(--gold); color:var(--indigo);}

  /* SEARCH */
  .resultado-row{display:none; gap:6px; padding:10px 14px 0 14px; background:var(--paper); flex-wrap:wrap;}
  .rchip{padding:6px 10px; border-radius:16px; font-size:12px; font-weight:600; background:#fff; border:1px solid var(--line);
    color:#565A72; cursor:pointer; display:flex; align-items:center; gap:5px;}
  .rchip .n{font-size:10.5px; font-weight:700; background:var(--gray-l); border-radius:8px; padding:1px 6px;}
  .rchip.active{background:var(--indigo-2); color:#fff; border-color:var(--indigo-2);}
  .rchip.active .n{background:rgba(255,255,255,.25); color:#fff;}

  .group-header{display:flex; align-items:center; gap:8px; margin:4px 2px 2px 2px; padding-top:6px;}
  .group-header .bar{width:4px; height:14px; background:var(--indigo-2); border-radius:2px;}
  .group-header .gname{font-size:12.5px; font-weight:700; color:var(--indigo-2); letter-spacing:.3px; text-transform:uppercase;}
  .group-header .gcount{font-size:11px; font-weight:700; color:#9498AD;}
  .bloco-subheader{font-size:11px; font-weight:700; color:#9498AD; margin:6px 4px 2px 14px; display:flex; gap:6px; align-items:center;}
  .bloco-subheader .n{font-weight:600; color:#B5B8CC;}
  .badge.dupwarn{background:#FFF1D6; color:#916C00; font-weight:700;}
  .search-banner{background:#EFEAFB; color:#6A4FB0; font-size:12px; font-weight:700; padding:8px 12px;
    border-radius:9px; margin-bottom:10px;}

  .folder-card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px;
    display:flex; align-items:center; gap:12px; margin-bottom:9px; cursor:pointer;}
  .folder-card:active{background:#F1F1F6;}
  .folder-ico{font-size:22px; flex:0 0 auto;}
  .folder-info{flex:1; min-width:0;}
  .folder-name{font-size:14.5px; font-weight:700; color:var(--ink);}
  .folder-sub{font-size:11.5px; color:#8488A0; margin-top:2px;}
  .folder-chev{font-size:22px; color:#C3C6D6; flex:0 0 auto;}
  .pg-breadcrumb{font-size:12.5px; font-weight:700; color:#1B6FA8; padding:6px 2px 10px; cursor:pointer;}
  .pg-tipo-header{font-size:12.5px; font-weight:800; color:var(--indigo-2); margin:14px 0 6px; padding-bottom:4px;
    border-bottom:2px solid var(--indigo-2); display:flex; gap:6px; align-items:baseline;}
  .pg-tipo-header span{font-weight:600; color:#9498AD; font-size:11px;}

  .report-view{display:none; position:fixed; inset:0; background:#fff; z-index:500; overflow-y:auto; color:#1A1D2E;}
  .report-view.show{display:block;}
  .report-view.printing{position:static !important; height:auto !important; overflow:visible !important;}
  .report-toolbar{position:sticky; top:0; background:#fff; border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top, 0px)) 14px 10px; display:flex; gap:8px; z-index:5;}
  .report-toolbar .btn{flex:1; padding:10px; border-radius:10px; font-size:13.5px; font-weight:700; border:none;}
  .report-hint{font-size:11.5px; color:#777; background:#F6F5FA; padding:10px 14px; border-bottom:1px solid var(--line);}
  .report-hint .btn{width:100%; padding:9px; border-radius:9px; font-size:12.5px; font-weight:700; border:1px solid var(--line); background:#fff; color:var(--indigo-2);}
  #reportContent{padding:16px;}
  .rep-header{display:flex; align-items:center; gap:10px; margin-bottom:4px;}
  .rep-header img{height:38px;}
  .rep-header .t{font-size:16px; font-weight:800;}
  .rep-sub{font-size:12px; color:#666; margin-bottom:14px;}
  .rep-totais{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px;}
  .rep-totais span{background:#EFEAFB; color:#6A4FB0; font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:20px;}
  .rep-tipo-title{font-size:14px; font-weight:800; margin:18px 0 6px; color:var(--indigo-2); border-bottom:2px solid var(--indigo-2); padding-bottom:4px;}
  .rep-status-title{font-size:12.5px; font-weight:700; margin:10px 0 4px; color:#555; text-transform:uppercase;}
  .rep-grupo-title{font-size:12px; font-weight:700; margin:8px 0 2px 6px; color:var(--indigo-2); display:flex; gap:6px; align-items:baseline;}
  .rep-grupo-title span{font-weight:600; color:#9498AD; font-size:10.5px;}
  .rep-bloco-title{font-size:11px; font-weight:700; margin:4px 0 2px 18px; color:#8488A0;}
  .rep-row{margin-left:18px;}
  .rep-row{display:flex; gap:8px; font-size:12px; padding:5px 0; border-bottom:1px solid #EEE; align-items:baseline;}
  .rep-row b{flex:0 0 auto;}
  .rep-row .rt{flex:1;}
  .rep-row .rm{flex:0 0 auto; color:#777; font-size:11px; display:flex; flex-direction:column; align-items:flex-end; gap:1px;}
  .rep-data{font-weight:700; color:#6A4FB0;}
  .rep-tinta-mini{font-size:9.5px; color:#A3A6B8;}
  .rep-empty{font-size:12px; color:#999; padding:4px 0;}
  @media print {
    body > *:not(.report-view){display:none !important;}
    .report-toolbar, .report-hint{display:none !important;}
    .report-view{position:static !important; height:auto !important; overflow:visible !important; inset:auto !important;}
  }
  @page{ margin:14mm; }

  .searchbar{padding:10px 14px; background:var(--paper);}
  .searchbar input{width:100%; padding:9px 12px; border-radius:10px; border:1px solid var(--line);
    background:#fff; font-size:14px; font-family:inherit; color:var(--ink);}
  .searchbar input:focus{outline:2px solid var(--indigo-2); outline-offset:1px;}

  /* LIST */
  #list{flex:1; padding:12px 12px 100px 12px; display:flex; flex-direction:column; gap:10px;}
  .empty{text-align:center; color:#9498AD; font-size:13.5px; padding:60px 20px; line-height:1.6;}
  .empty b{display:block; color:var(--ink); font-size:15px; margin-bottom:4px; font-weight:600;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 13px; position:relative;}
  .card.stale::before{content:''; position:absolute; top:10px; right:10px; width:8px; height:8px; border-radius:50%; background:var(--red);}
  .card.overdue{border-left:4px solid var(--red); border-top-color:#F3C9C2; border-right-color:#F3C9C2; border-bottom-color:#F3C9C2;}
  .badge.overduewarn{background:var(--red); color:#fff; animation:pulseOverdue 1.8s ease-in-out infinite;}
  @keyframes pulseOverdue{ 0%,100%{opacity:1;} 50%{opacity:.55;} }
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; cursor:pointer;}
  .card-ids{display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:3px;}
  .num{font-size:11.5px; color:#767A94; font-weight:600;}
  .local{font-size:11.5px; background:var(--gray-l); color:#5A5E75; padding:1px 7px; border-radius:6px; font-weight:600;}
  .titulo{font-size:14.5px; font-weight:600; color:var(--ink); line-height:1.35;}
  .nota-rapida{font-size:12px; color:#6A4FB0; background:#F4F1FB; border-radius:7px; padding:4px 8px;
    margin-top:5px; display:inline-block; font-weight:600;}
  .meta-row{display:flex; align-items:center; gap:6px; margin-top:7px; flex-wrap:wrap;}
  .badge{font-size:11px; font-weight:700; padding:3px 8px; border-radius:7px;}
  .badge.d-ok{background:var(--green-l); color:var(--green);}
  .badge.d-warn{background:var(--gold-l); color:#916C00;}
  .badge.d-late{background:var(--red-l); color:var(--red);}
  .badge.stalewarn{background:var(--red-l); color:var(--red); display:flex; align-items:center; gap:4px;}

  .chev{color:#B5B8CC; flex:0 0 auto; transition:transform .15s;}
  .card.open .chev{transform:rotate(180deg);}

  .card-body{max-height:0; overflow:hidden; transition:max-height .2s ease;}
  .card.open .card-body{max-height:600px; margin-top:10px;}
  .field{margin-bottom:8px;}
  .field label{display:block; font-size:11px; font-weight:600; color:#8488A0; margin-bottom:3px; text-transform:uppercase; letter-spacing:.3px;}
  .checkbox-field{margin-top:-2px;}
  .checkbox-label{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--ink);
    text-transform:none !important; letter-spacing:0 !important; cursor:pointer;}
  .checkbox-label input[type="checkbox"]{width:18px; height:18px; flex:0 0 auto;}
  .field label .clear-date{float:right; text-transform:none; font-weight:700; color:var(--red); cursor:pointer; font-size:10.5px; letter-spacing:0;}
  .field textarea, .field input, .field select{width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    font-size:13.5px; font-family:inherit; color:var(--ink); background:#FCFCFD;}
  .field textarea{resize:vertical; min-height:52px;}
  .row2{display:flex; gap:8px;}
  .row2 > *{flex:1;}
  .card-actions{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
  .btn{border:none; border-radius:8px; padding:8px 11px; font-size:12.5px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; gap:5px; font-family:inherit;}
  .btn-primary{background:var(--indigo-2); color:#fff;}
  .btn-done{background:var(--green); color:#fff;}
  .btn-ghost{background:var(--gray-l); color:#565A72;}
  .btn-danger{background:var(--red-l); color:var(--red);}
  .btn:active{opacity:.8; transform:scale(.98);}

  /* FAB */
  .fab{position:fixed; bottom:22px; right:calc(50% - 280px + 20px); z-index:30; background:var(--indigo-2); color:#fff;
    width:56px; height:56px; border-radius:50%; border:none; box-shadow:0 6px 16px rgba(43,49,99,.35);
    display:flex; align-items:center; justify-content:center; cursor:pointer;}
  @media (max-width:600px){ .fab{ right:20px; } }
  .fab:active{transform:scale(.94);}

  /* MODAL */
  .overlay{position:fixed; inset:0; background:rgba(20,20,35,.45); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
  .overlay.hidden{display:none;}
  .sheet{background:#fff; width:100%; max-width:560px; border-radius:18px 18px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom)) 18px;
    max-height:88vh; overflow-y:auto;}
  .sheet h2{font-size:16.5px; margin:0 0 14px 0; color:var(--ink); font-weight:700;}
  .sheet .close{position:absolute; top:14px; right:16px;}
  .sheet-actions{display:flex; gap:8px; margin-top:14px;}
  .sheet-actions .btn{flex:1; justify-content:center; padding:11px;}

  .backup-tabs{display:flex; gap:6px; margin-bottom:14px;}
  .backup-tab{flex:1; text-align:center; padding:9px; border-radius:9px; font-size:13px; font-weight:700;
    background:var(--gray-l); color:#6B6F87; cursor:pointer;}
  .backup-tab.active{background:var(--indigo-2); color:#fff;}
  .backup-textarea{width:100%; min-height:150px; border:1px solid var(--line); border-radius:8px; padding:10px;
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink); background:#FCFCFD; resize:vertical;}
  .small-note{font-size:11.5px; color:#8488A0; line-height:1.5; margin:8px 0;}
  .backup-file-btn{display:inline-flex; align-items:center; gap:6px; margin-top:8px; font-size:12.5px; font-weight:600;
    color:var(--indigo-2); cursor:pointer;}

  .toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:9px 16px; border-radius:20px; font-size:12.5px; font-weight:600; z-index:60; opacity:0; transition:opacity .2s, transform .2s;
    pointer-events:none;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
</style>
</head>

<div id="app">

  let modoAtencao = false;
  let pgNivel = 'grupos'; // 'grupos' | 'blocos' | 'chamados'
  let pgGrupo = null;
  let pgBloco = null;
  let activeTab = 'aguardando';
  let activeResultado = 'todos';
  let searchTerm = '';
  let openCardId = null;

  const $ = sel => document.querySelector(sel);
  const uid = () => 't_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const now = () => new Date().toISOString();

  function daysSince(iso){
    if(!iso) return 0;
    const d = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
    return d < 0 ? 0 : d;
  }
  function todayStr(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function parseDateOnly(str){
    if(!str) return null;
    const [y,m,d] = str.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  function daysSinceDateOnly(str){
    const d = parseDateOnly(str);
    if(!d) return 0;
    const hoje = parseDateOnly(todayStr());
    const dias = Math.round((hoje - d) / 86400000);
    return dias < 0 ? 0 : dias;
  }
  function fmtDateOnly(str){
    const d = parseDateOnly(str);
    if(!d) return '';
    return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
  }
  function fmtDate(iso){
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR');
  }
  function corTemperatura(dias){
    // verde -> dourado -> vermelho conforme os dias em aberto vão passando,
    // mesmo sem estar formalmente atrasado (é só um alerta visual de "esfriando")
    const stops = [
      {d:0,  c:[46,139,79]},   // verde
      {d:7,  c:[245,194,66]},  // dourado
      {d:15, c:[192,57,43]},   // vermelho
    ];
    const dd = Math.max(0, dias||0);
    let lo = stops[0], hi = stops[1];
    if(dd >= stops[2].d){ return `rgb(${stops[2].c.join(',')})`; }
    if(dd >= stops[1].d){ lo = stops[1]; hi = stops[2]; }
    const t = (dd - lo.d) / (hi.d - lo.d);
    const c = lo.c.map((v,i)=> Math.round(v + (hi.c[i]-v)*t));
    return `rgb(${c.join(',')})`;
  }
  function diasBadgeClass(dias){
    if(dias > 30) return 'd-late';
    if(dias > 15) return 'd-warn';
    return 'd-ok';
  }

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      tickets = raw ? JSON.parse(raw) : [];
      tickets.forEach(t=>{
        if(!t.tipo) t.tipo = 'unidade';
        if(!t.grupo) t.grupo = '';
        if(!t.bloco) t.bloco = '';
        if(!t.resultado) t.resultado = '';
        if(!t.dataPrevista) t.dataPrevista = '';
        if(!t.dataVistoria) t.dataVistoria = '';
        if(!t.tintaTipo) t.tintaTipo = '';
        if(!t.tintaStatus) t.tintaStatus = '';
        if(t.aguardandoChat === undefined) t.aguardandoChat = false;
        if(t.aguardandoChatDesde === undefined) t.aguardandoChatDesde = '';
        if(t.nota === undefined) t.nota = '';
      });
    }catch(e){ tickets = []; }
    render();
  }
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(tickets)); }
    catch(e){ showToast('Não foi possível salvar agora (armazenamento indisponível)'); }
  }
  function showToast(msg){
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
  }

  function addTicket(data){
    const t = { id: uid(), numero:data.numero||'', local:data.local||'', titulo:data.titulo,
      obs:data.obs||'', aguardando:'', status:'aguardando', tipo:data.tipo||'unidade', grupo:data.grupo||'',
      bloco:data.bloco||'', resultado:'', dataAbertura: data.dataAbertura || todayStr(), dataPrevista: data.dataPrevista || '',
      dataVistoria: data.dataVistoria || '',
      tintaTipo: data.tintaTipo || '', tintaStatus: data.tintaStatus || '', aguardandoChat: false, aguardandoChatDesde: '', nota: data.nota || '',
      criadoEm: now(), atualizadoEm: now() };
    tickets.unshift(t);
    save(); activeTab='aguardando'; activeTipo=t.tipo; render(); showToast('Chamado adicionado');
  }
  function updateTicket(id, patch){
    const t = tickets.find(x=>x.id===id); if(!t) return;
    Object.assign(t, patch, {atualizadoEm: now()});
    save(); render();
  }
  function deleteTicket(id){
    tickets = tickets.filter(x=>x.id!==id);
    save(); render(); showToast('Chamado removido');
  }

  function counts(list){
    const c = {}; STAGES.forEach(s=>c[s.key]=0);
    list.forEach(t=>{ if(c[t.status]!==undefined) c[t.status]++; });
    return c;
  }

  function isAtrasado(t){
    if(t.status === 'concluido') return false;
    if(t.status === 'aguardando' || t.status === 'vistoria'){
      return !!(t.dataVistoria && todayStr() > t.dataVistoria);
    }
    return !!(t.dataPrevista && todayStr() > t.dataPrevista);
  }
  function isTintaPendente(t){
    return !!(t.tintaTipo && t.status !== 'concluido' && t.tintaStatus !== 'adquirida');
  }
  function isAguardandoChat(t){
    return !!(t.status !== 'concluido' && t.aguardandoChat);
  }
  function isChatVencido(t){
    if(!isAguardandoChat(t) || !t.aguardandoChatDesde) return false;
    const horas = (Date.now() - new Date(t.aguardandoChatDesde).getTime()) / 3600000;
    return horas >= 72;
  }

  function urgenciaScore(t){
    // quanto maior, mais urgente — usado pra ordenar os piores casos no topo de cada bloco
    if(t.status === 'concluido') return -1;
    let score = 0;
    if(isAtrasado(t)){
      const usaVistoria = (t.status === 'aguardando' || t.status === 'vistoria');
      const dataRelevante = usaVistoria ? t.dataVistoria : t.dataPrevista;
      score += 10000 + daysSinceDateOnly(dataRelevante);
    }
    if(isChatVencido(t)) score += 5000;
    if(isTintaPendente(t)) score += 500;
    score += daysSinceDateOnly(t.dataAbertura) || 0;
    return score;
  }
  function temAlerta(t, duplicados){
    if(t.status === 'concluido') return false;
    if(isAtrasado(t)) return true;
    if(isTintaPendente(t)) return true;
    if(isChatVencido(t)) return true;
    if((t.numero||'').trim() && duplicados.has((t.numero||'').trim())) return true;
    return false;
  }
  function motivosAlerta(t, duplicados){
    const motivos = [];
    if(isAtrasado(t)) motivos.push('⏰ Atrasado');
    if(isChatVencido(t)) motivos.push('⏰ Chat +72h');
    if(isTintaPendente(t)) motivos.push('🎨 Tinta pendente');
    if((t.numero||'').trim() && duplicados.has((t.numero||'').trim())) motivos.push('⚠ nº duplicado');
    return motivos;
  }

  function renderSummary(){
    if(modoPorGrupo || modoAtencao){
      $('#summaryRow').innerHTML = '';
      return;
    }
    if(modoGeral){
      const c = counts(tickets);
      const total = tickets.length;
      const ativos = total - c.concluido;
      const atrasados = tickets.filter(isAtrasado).length;
      const nDup = getDuplicateNumeros().size;
      const aguardandoChat = tickets.filter(isAguardandoChat).length;
      const chatVencidos = tickets.filter(isChatVencido).length;
      $('#summaryRow').innerHTML = `
        <div class="pill"><b>${total}</b> chamados no total</div>
        <div class="pill"><b>${ativos}</b> em aberto</div>
        ${atrasados>0?`<div class="pill" style="background:var(--red); border-color:var(--red);"><b>${atrasados}</b> ⏰ atrasados</div>`:''}
        ${nDup>0?`<div class="pill" style="background:#916C00; border-color:#916C00;"><b>${nDup}</b> ⚠ nº duplicado</div>`:''}
        ${aguardandoChat>0?`<div class="pill" style="background:#1B6FA8; border-color:#1B6FA8;"><b>${aguardandoChat}</b> 💬 aguardando resposta</div>`:''}
        ${chatVencidos>0?`<div class="pill" style="background:var(--red); border-color:var(--red);"><b>${chatVencidos}</b> ⏰ chat +72h sem resposta</div>`:''}
      `;
      return;
    }
    const escopo = tickets.filter(t=>t.tipo===activeTipo);
    const c = counts(escopo);
    const total = escopo.length;
    const ativos = total - c.concluido;
    const atrasados = escopo.filter(isAtrasado).length;
    const tintasPendentes = escopo.filter(isTintaPendente).length;
    const aguardandoChat = escopo.filter(isAguardandoChat).length;
    const chatVencidos = escopo.filter(isChatVencido).length;
    $('#summaryRow').innerHTML = `
      <div class="pill"><b>${total}</b> ${activeTipo==='unidade'?'apartamentos':'áreas comuns'}</div>
      <div class="pill"><b>${ativos}</b> em aberto</div>
      <div class="pill"><b>${c.pendente}</b> pendentes</div>
      ${atrasados>0?`<div class="pill" style="background:var(--red); border-color:var(--red);"><b>${atrasados}</b> ⏰ atrasados</div>`:''}
      ${tintasPendentes>0?`<div class="pill" style="background:#916C00; border-color:#916C00;"><b>${tintasPendentes}</b> 🎨 tinta pendente</div>`:''}
      ${aguardandoChat>0?`<div class="pill" style="background:#1B6FA8; border-color:#1B6FA8;"><b>${aguardandoChat}</b> 💬 aguardando resposta</div>`:''}
      ${chatVencidos>0?`<div class="pill" style="background:var(--red); border-color:var(--red);"><b>${chatVencidos}</b> ⏰ chat +72h sem resposta</div>`:''}
    `;
  }

  function renderTipos(){
    const duplicados = getDuplicateNumeros();
    const nAtencao = tickets.filter(t=>temAlerta(t, duplicados)).length;
    $('#tipos').innerHTML = TIPOS.map(tp=>`
      <div class="tipo-btn ${(!modoGeral && !modoPorGrupo && !modoAtencao && activeTipo===tp.key)?'active':''}" data-tipo="${tp.key}">${tp.label}</div>
    `).join('')
      + `<div class="tipo-btn ${modoGeral?'active':''}" data-tipo="__geral" style="${modoGeral?'':'background:#EFEAFB; color:#6A4FB0;'}">🗂 Geral</div>`
      + `<div class="tipo-btn ${modoPorGrupo?'active':''}" data-tipo="__porgrupo" style="${modoPorGrupo?'':'background:#EAF3FB; color:#1B6FA8;'}">📂 Revisar por Grupo</div>`
      + `<div class="tipo-btn ${modoAtencao?'active':''}" data-tipo="__atencao" style="${modoAtencao?'background:var(--red); color:#fff;':'background:var(--red-l); color:var(--red);'}">🔴 Precisa de atenção${nAtencao>0?` <span style="font-weight:800;">(${nAtencao})</span>`:''}</div>`;
    $('#tipos').querySelectorAll('.tipo-btn').forEach(el=>{
      el.addEventListener('click', ()=>{
        if(el.dataset.tipo==='__geral'){ modoGeral = true; modoPorGrupo = false; modoAtencao = false; }
        else if(el.dataset.tipo==='__porgrupo'){ modoPorGrupo = true; modoGeral = false; modoAtencao = false; pgNivel='grupos'; pgGrupo=null; pgBloco=null; }
        else if(el.dataset.tipo==='__atencao'){ modoAtencao = true; modoGeral = false; modoPorGrupo = false; }
        else { modoGeral = false; modoPorGrupo = false; modoAtencao = false; activeTipo = el.dataset.tipo; }
        openCardId=null; render();
      });
    });
  }

  function renderTabs(){
    if(modoGeral || modoPorGrupo || modoAtencao){
      $('#tabs').innerHTML = '';
      $('#resultadoRow').style.display = 'none';
      return;
    }
    const escopo = tickets.filter(t=>t.tipo===activeTipo);
    const c = counts(escopo);
    $('#tabs').innerHTML = STAGES.map(s=>`
      <div class="tab ${activeTab===s.key?'active':''}" data-tab="${s.key}">
        ${s.label} <span class="n">${c[s.key]}</span>
      </div>`).join('');
    $('#tabs').querySelectorAll('.tab').forEach(el=>{
      el.addEventListener('click', ()=>{ activeTab = el.dataset.tab; activeResultado='todos'; openCardId=null; render(); });
    });

    if(activeTab==='concluido'){
      const concluidos = escopo.filter(t=>t.status==='concluido');
      const nProc = concluidos.filter(t=>t.resultado==='procedente').length;
      const nImproc = concluidos.filter(t=>t.resultado==='improcedente').length;
      $('#resultadoRow').style.display = 'flex';
      $('#resultadoRow').innerHTML = `
        <div class="rchip ${activeResultado==='todos'?'active':''}" data-res="todos">Todos <span class="n">${concluidos.length}</span></div>
        <div class="rchip ${activeResultado==='procedente'?'active':''}" data-res="procedente">✅ Procedente <span class="n">${nProc}</span></div>
        <div class="rchip ${activeResultado==='improcedente'?'active':''}" data-res="improcedente">❌ Improcedente <span class="n">${nImproc}</span></div>
      `;
      $('#resultadoRow').querySelectorAll('.rchip').forEach(el=>{
        el.addEventListener('click', ()=>{ activeResultado = el.dataset.res; render(); });
      });
    } else {
      $('#resultadoRow').style.display = 'none';
    }
  }

  function getDuplicateNumeros(){
    const contagem = {};
    tickets.forEach(t=>{
      const n = (t.numero||'').trim();
      if(!n) return;
      contagem[n] = (contagem[n]||0) + 1;
    });
    const dup = new Set();
    Object.keys(contagem).forEach(n=>{ if(contagem[n] > 1) dup.add(n); });
    return dup;
  }

  function agruparEmHtml(items, opts){
    opts = opts || {};
    const porGrupo = {};
    GRUPOS.forEach(g=>porGrupo[g]=[]);
    porGrupo['__sem'] = [];
    items.forEach(t=>{
      const g = GRUPOS.includes(t.grupo) ? t.grupo : '__sem';
      porGrupo[g].push(t);
    });
    let html = '';
    [...GRUPOS, '__sem'].forEach(g=>{
      const arr = porGrupo[g];
      if(!arr || arr.length===0) return;
      const nomeGrupo = g==='__sem' ? 'Sem grupo definido' : 'Grupo ' + g.replace('G','');
      html += `<div class="group-header"><div class="bar"></div><div class="gname">${nomeGrupo}</div><div class="gcount">${arr.length}</div></div>`;

      const porBloco = {};
      BLOCOS.forEach(b=>porBloco[b]=[]);
      porBloco['__semB'] = [];
      arr.forEach(t=>{
        const b = BLOCOS.includes(t.bloco) ? t.bloco : '__semB';
        porBloco[b].push(t);
      });
      [...BLOCOS, '__semB'].forEach(b=>{
        const arrB = porBloco[b];
        if(!arrB || arrB.length===0) return;
        arrB.sort((x,y)=> urgenciaScore(y) - urgenciaScore(x) || (new Date(x.atualizadoEm) - new Date(y.atualizadoEm)));
        if(opts.mostrarSubBloco){
          const nomeBloco = b==='__semB' ? 'Sem bloco' : 'Bloco ' + b;
          html += `<div class="bloco-subheader">${nomeBloco} <span class="n">${arrB.length}</span></div>`;
        }
        html += arrB.map(t => cardHtml(t, opts.cardOpts||{})).join('');
      });
    });
    return html;
  }

  function renderPorGrupo(list){
    // nível 1: lista de pastas de Grupo
    if(pgNivel === 'grupos'){
      const grupos = [...GRUPOS, '__sem'];
      let html = `<div class="search-banner">📂 Revisar por Grupo — toque num grupo pra abrir</div>`;
      html += grupos.map(g=>{
        const arr = tickets.filter(t => GRUPOS.includes(t.grupo) ? t.grupo===g : g==='__sem');
        if(arr.length===0) return '';
        const nome = g==='__sem' ? 'Sem grupo definido' : 'Grupo ' + g.replace('G','');
        const atrasados = arr.filter(isAtrasado).length;
        return `<div class="folder-card" data-pggrupo="${g}">
          <div class="folder-ico">📁</div>
          <div class="folder-info">
            <div class="folder-name">${nome}</div>
            <div class="folder-sub">${arr.length} chamado${arr.length===1?'':'s'}${atrasados>0?` · ⏰ ${atrasados} atrasado${atrasados===1?'':'s'}`:''}</div>
          </div>
          <div class="folder-chev">›</div>
        </div>`;
      }).join('');
      if(!html.includes('folder-card')) html += `<div class="empty"><b>Nada por aqui ainda</b>Cadastre chamados com um grupo definido pra eles aparecerem aqui.</div>`;
      list.innerHTML = html;
      list.querySelectorAll('[data-pggrupo]').forEach(el=>{
        el.addEventListener('click', ()=>{ pgGrupo = el.dataset.pggrupo; pgNivel='blocos'; pgBloco=null; render(); });
      });
      return;
    }

    // nível 2: lista de pastas de Bloco dentro do grupo escolhido
    if(pgNivel === 'blocos'){
      const nomeGrupo = pgGrupo==='__sem' ? 'Sem grupo definido' : 'Grupo ' + pgGrupo.replace('G','');
      const doGrupo = tickets.filter(t => GRUPOS.includes(t.grupo) ? t.grupo===pgGrupo : pgGrupo==='__sem');
      const blocos = [...BLOCOS, '__semB'];
      let html = `<div class="pg-breadcrumb" data-pgback="grupos">← Todos os grupos</div>
        <div class="search-banner">📂 ${nomeGrupo} — toque num bloco pra abrir</div>`;
      html += blocos.map(b=>{
        const arr = doGrupo.filter(t => BLOCOS.includes(t.bloco) ? t.bloco===b : b==='__semB');
        if(arr.length===0) return '';
        const nome = b==='__semB' ? 'Sem bloco' : 'Bloco ' + b;
        const atrasados = arr.filter(isAtrasado).length;
        return `<div class="folder-card" data-pgbloco="${b}">
          <div class="folder-ico">🗂</div>
          <div class="folder-info">
            <div class="folder-name">${nome}</div>
            <div class="folder-sub">${arr.length} chamado${arr.length===1?'':'s'}${atrasados>0?` · ⏰ ${atrasados} atrasado${atrasados===1?'':'s'}`:''}</div>
          </div>
          <div class="folder-chev">›</div>
        </div>`;
      }).join('');
      list.innerHTML = html;
      list.querySelector('[data-pgback]').addEventListener('click', ()=>{ pgNivel='grupos'; pgGrupo=null; render(); });
      list.querySelectorAll('[data-pgbloco]').forEach(el=>{
        el.addEventListener('click', ()=>{ pgBloco = el.dataset.pgbloco; pgNivel='chamados'; render(); });
      });
      return;
    }

    // nível 3: chamados do grupo + bloco escolhidos, separados por Apartamento / Área Comum
    const nomeGrupo = pgGrupo==='__sem' ? 'Sem grupo definido' : 'Grupo ' + pgGrupo.replace('G','');
    const nomeBloco = pgBloco==='__semB' ? 'Sem bloco' : 'Bloco ' + pgBloco;
    const itens = tickets.filter(t=>{
      const g = GRUPOS.includes(t.grupo) ? t.grupo : '__sem';
      const b = BLOCOS.includes(t.bloco) ? t.bloco : '__semB';
      return g===pgGrupo && b===pgBloco;
    });
    let html = `<div class="pg-breadcrumb" data-pgback="blocos">← ${nomeGrupo}</div>
      <div class="search-banner">🗂 ${nomeGrupo} · ${nomeBloco} — ${itens.length} chamado${itens.length===1?'':'s'}</div>`;
    TIPOS.forEach(tp=>{
      const doTipo = itens.filter(t=>t.tipo===tp.key).sort((a,b)=> urgenciaScore(b) - urgenciaScore(a) || (new Date(a.atualizadoEm) - new Date(b.atualizadoEm)));
      if(doTipo.length===0) return;
      html += `<div class="pg-tipo-header">${tp.label} <span>${doTipo.length}</span></div>`;
      html += doTipo.map(t => cardHtml(t, {mostrarStatus:true})).join('');
    });
    if(itens.length===0) html += `<div class="empty"><b>Vazio por aqui</b>Nenhum chamado neste bloco.</div>`;
    list.innerHTML = html;
    list.querySelector('[data-pgback]').addEventListener('click', ()=>{ pgNivel='blocos'; pgBloco=null; render(); });
  }

  function renderList(){
    const list = $('#list');
    const buscando = searchTerm.trim().length > 0;

    if(buscando){
      const q = searchTerm.toLowerCase();
      let items = tickets.filter(t => (t.numero||'').toLowerCase().includes(q) ||
        (t.local||'').toLowerCase().includes(q) || (t.titulo||'').toLowerCase().includes(q));
      items.sort((a,b)=> new Date(b.atualizadoEm) - new Date(a.atualizadoEm));

      if(items.length===0){
        list.innerHTML = `<div class="empty"><b>Nada encontrado</b>Nenhum chamado com "${escapeHtml(searchTerm)}" em nenhuma aba.</div>`;
        return;
      }
      let html = `<div class="search-banner">🔎 Buscando em todos os chamados — ${items.length} resultado${items.length===1?'':'s'}</div>`;
      html += items.map(t => cardHtml(t, {mostrarContexto:true})).join('');
      list.innerHTML = html;
      return;
    }

    if(modoPorGrupo){
      renderPorGrupo(list);
      return;
    }

    if(modoAtencao){
      const duplicados = getDuplicateNumeros();
      const itens = tickets.filter(t=>temAlerta(t, duplicados));
      if(itens.length===0){
        list.innerHTML = `<div class="empty"><b>Tudo em dia! 🎉</b>Nenhum chamado com atraso, tinta pendente, chat travado ou número duplicado no momento.</div>`;
        return;
      }
      list.innerHTML = `<div class="search-banner" style="background:var(--red-l); color:var(--red);">🔴 Chamados que precisam de atenção agora — ${itens.length} no total</div>` +
        agruparEmHtml(itens, {mostrarSubBloco:true, cardOpts:{mostrarContexto:true}});
      return;
    }

    if(modoGeral){
      if(tickets.length===0){
        list.innerHTML = `<div class="empty"><b>Tudo limpo por aqui</b>Nenhum chamado cadastrado ainda.</div>`;
        return;
      }
      list.innerHTML = `<div class="search-banner">🗂 Todos os chamados, organizados por grupo e bloco — ${tickets.length} no total</div>` +
        agruparEmHtml(tickets, {mostrarSubBloco:true, cardOpts:{mostrarContexto:true}});
      return;
    }

    let items = tickets.filter(t => t.tipo === activeTipo && t.status === activeTab);
    if(activeTab==='concluido' && activeResultado!=='todos'){
      items = items.filter(t => t.resultado === activeResultado);
    }
    items.sort((a,b)=> new Date(a.atualizadoEm) - new Date(b.atualizadoEm));

    if(items.length===0){
      const msgs = {
        aguardando:'Nenhum chamado aguardando. Toque no + para adicionar um novo.',
        vistoria:'Nada em vistoria no momento.',
        reparo:'Nada em reparo no momento.',
        pendente:'Nenhum chamado pendente — nada parado esperando algo.',
        concluido:'Ainda não há chamados concluídos aqui.'
      };
      list.innerHTML = `<div class="empty"><b>Tudo limpo por aqui</b>${msgs[activeTab]}</div>`;
      return;
    }

    // agrupar por grupo (G11..G18) e sub-agrupar por bloco, pra não ficar misturado
    list.innerHTML = agruparEmHtml(items, {mostrarSubBloco:true});
  }

  function cardHtml(t, opts){
    opts = opts || {};
    const duplicados = getDuplicateNumeros();
    const dias = daysSinceDateOnly(t.dataAbertura);
    const stale = daysSince(t.atualizadoEm) >= 2 && t.status !== 'concluido';
    const usaVistoria = (t.status === 'aguardando' || t.status === 'vistoria');
    const dataRelevante = usaVistoria ? t.dataVistoria : t.dataPrevista;
    const atrasado = isAtrasado(t);
    const chatVencido = isChatVencido(t);
    const diasDeAtraso = atrasado ? daysSinceDateOnly(dataRelevante) : 0;
    const isOpen = openCardId === t.id;
    const corTemp = (t.status!=='concluido' && !atrasado && !chatVencido) ? corTemperatura(dias) : null;
    const prevista = dataRelevante ? `<span class="badge mono" style="background:${atrasado?'#FBE7E4':'#EFEAFB'}; color:${atrasado?'var(--red)':'#6A4FB0'};">${usaVistoria?'vistoria':'prev'}: ${fmtDateOnly(dataRelevante)}</span>` : '';
    let resultadoBadge = '';
    if(t.status==='concluido'){
      if(t.resultado==='procedente') resultadoBadge = `<span class="badge d-ok">✅ Procedente</span>`;
      else if(t.resultado==='improcedente') resultadoBadge = `<span class="badge d-late">❌ Improcedente</span>`;
      else resultadoBadge = `<span class="badge d-warn">⚠ definir resultado</span>`;
    }
    let tintaBadge = '';
    if(t.tintaTipo){
      const tLabel = t.tintaTipo==='padrao' ? '🎨 Padrão' : '🎨 Proprietário';
      let tFill = '#EEEFF3', tColor = '#5A5E75';
      if(t.tintaStatus==='adquirida'){ tFill = 'var(--green-l)'; tColor = 'var(--green)'; }
      else if(t.tintaStatus==='nao_adquirida'){ tFill = 'var(--red-l)'; tColor = 'var(--red)'; }
      else if(t.tintaStatus==='aguardando_info'){ tFill = 'var(--gold-l)'; tColor = '#916C00'; }
      tintaBadge = `<span class="badge" style="background:${tFill}; color:${tColor};">${tLabel}</span>`;
    }
    const numeroDup = (t.numero||'').trim() && duplicados.has((t.numero||'').trim());
    const contexto = opts.mostrarContexto ? `
      <span class="badge" style="background:var(--indigo-2); color:#fff;">${t.tipo==='unidade'?'🏠 Apartamento':'🏢 Área Comum'}</span>
      <span class="badge" style="background:${(STAGES.find(s=>s.key===t.status)||{}).color||'#8B8FA3'}; color:#fff;">${(STAGES.find(s=>s.key===t.status)||{}).label||t.status}</span>
    ` : (opts.mostrarStatus ? `
      <span class="badge" style="background:${(STAGES.find(s=>s.key===t.status)||{}).color||'#8B8FA3'}; color:#fff;">${(STAGES.find(s=>s.key===t.status)||{}).label||t.status}</span>
    ` : '');
    return `
      <div class="card ${isOpen?'open':''} ${stale?'stale':''} ${(atrasado||chatVencido)?'overdue':''}" data-id="${t.id}" ${corTemp?`style="border-left:4px solid ${corTemp};"`:''}>
        <div class="card-top" data-toggle="${t.id}">
          <div>
            <div class="card-ids">
              ${t.numero?`<span class="num mono">#${escapeHtml(t.numero)}</span>`:''}
              ${t.local?`<span class="local">${escapeHtml(t.local)}</span>`:''}
              ${t.grupo?`<span class="local" style="background:#E7E9F5; color:var(--indigo-2);">${escapeHtml(t.grupo)}</span>`:''}
              ${t.bloco?`<span class="local" style="background:#FDECC8; color:#916C00;">Bloco ${escapeHtml(t.bloco)}</span>`:''}
            </div>
            <div class="titulo">${escapeHtml(t.titulo)}</div>
            ${t.nota ? `<div class="nota-rapida">📝 ${escapeHtml(t.nota)}</div>` : ''}
            <div class="meta-row">
              ${contexto}
              <span class="badge mono" style="background:var(--gray-l); color:#5A5E75;">${fmtDateOnly(t.dataAbertura)}</span>
              <span class="badge ${diasBadgeClass(dias)}">${dias===0?'aberto hoje':dias+'d em aberto'}</span>
              ${prevista}
              ${atrasado?`<span class="badge overduewarn">⏰ Atrasado ${diasDeAtraso}d</span>`:''}
              ${tintaBadge}
              ${numeroDup?`<span class="badge dupwarn">⚠ nº duplicado</span>`:''}
              ${t.status!=='concluido' && t.aguardandoChat ? (chatVencido
                ? `<span class="badge overduewarn">⏰ Chat sem resposta há +72h</span>`
                : `<span class="badge" style="background:#1B6FA8; color:#fff;">💬 Aguardando resposta</span>`) : ''}
              ${resultadoBadge}
              ${stale?`<span class="badge stalewarn">⚠ sem mexer há ${daysSince(t.atualizadoEm)}d</span>`:''}
            </div>
          </div>
          <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="#B5B8CC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="card-body">
          <div class="row2">
            <div class="field"><label>Número do chamado</label><input type="text" data-field="numero" data-id="${t.id}" value="${escapeAttr(t.numero)}" placeholder="ex: 70455"></div>
            <div class="field"><label>Tipo</label>
              <select data-field="tipo" data-id="${t.id}">
                ${TIPOS.map(tp=>`<option value="${tp.key}" ${tp.key===t.tipo?'selected':''}>${tp.label}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="field"><label>Título</label><input type="text" data-field="titulo" data-id="${t.id}" value="${escapeAttr(t.titulo)}" placeholder="ex: Infiltração no banheiro"></div>
          <div class="field"><label>📝 Nota rápida <span style="text-transform:none; font-weight:500; color:#B0B3C4;">(aparece resumida no card)</span></label><input type="text" data-field="nota" data-id="${t.id}" value="${escapeAttr(t.nota)}" placeholder="ex: vistoria de conclusão com engenheiro"></div>
          <div class="row2">
            <div class="field"><label>Grupo</label>
              <select data-field="grupo" data-id="${t.id}">
                <option value="">Sem grupo</option>
                ${GRUPOS.map(g=>`<option value="${g}" ${g===t.grupo?'selected':''}>${g}</option>`).join('')}
              </select>
            </div>
            <div class="field"><label>Bloco</label>
              <select data-field="bloco" data-id="${t.id}">
                <option value="">Sem bloco</option>
                ${BLOCOS.map(b=>`<option value="${b}" ${b===t.bloco?'selected':''}>Bloco ${b}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="row2">
            <div class="field"><label>Data de abertura ${t.dataAbertura?`<span class="clear-date" data-clearfield="dataAbertura" data-id="${t.id}">✕ limpar</span>`:''}</label><input type="date" data-field="dataAbertura" data-id="${t.id}" value="${t.dataAbertura||''}"></div>
            ${usaVistoria
              ? `<div class="field"><label>Data prevista da vistoria ${t.dataVistoria?`<span class="clear-date" data-clearfield="dataVistoria" data-id="${t.id}">✕ limpar</span>`:''}</label><input type="date" data-field="dataVistoria" data-id="${t.id}" value="${t.dataVistoria||''}"></div>`
              : `<div class="field"><label>Prev. finalização ${t.dataPrevista?`<span class="clear-date" data-clearfield="dataPrevista" data-id="${t.id}">✕ limpar</span>`:''}</label><input type="date" data-field="dataPrevista" data-id="${t.id}" value="${t.dataPrevista||''}"></div>`}
          </div>
          <div class="row2">
            <div class="field"><label>Tinta</label>
              <select data-field="tintaTipo" data-id="${t.id}">
                <option value="">Não se aplica</option>
                ${TINTA_TIPOS.map(tt=>`<option value="${tt.key}" ${tt.key===t.tintaTipo?'selected':''}>${tt.label}</option>`).join('')}
              </select>
            </div>
            <div class="field"><label>Status da tinta</label>
              <select data-field="tintaStatus" data-id="${t.id}">
                <option value="">— definir —</option>
                ${TINTA_STATUS.map(ts=>`<option value="${ts.key}" ${ts.key===t.tintaStatus?'selected':''}>${ts.label}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="field"><label>Local / unidade</label><input type="text" data-field="local" data-id="${t.id}" value="${escapeAttr(t.local)}" placeholder="ex: Bloco C - Apto 212"></div>
          <div class="field"><label>Observações</label><textarea data-field="obs" data-id="${t.id}" placeholder="anotações, o que já foi feito, etc.">${escapeHtml(t.obs)}</textarea></div>
          ${t.status==='pendente' ? `<div class="field"><label>Aguardando o quê</label><input type="text" data-field="aguardando" data-id="${t.id}" value="${escapeAttr(t.aguardando)}" placeholder="ex: peça, aprovação do cooperado…"></div>` : ''}
          ${t.status!=='concluido' ? `<div class="field checkbox-field">
            <label class="checkbox-label">
              <input type="checkbox" data-field="aguardandoChat" data-id="${t.id}" ${t.aguardandoChat?'checked':''}>
              💬 Aguardando resposta no chat da plataforma
            </label>
          </div>` : ''}
          <div class="field"><label>Mover para</label>
            <select data-field="status-resultado" data-id="${t.id}">
              ${STAGES.filter(s=>s.key!=='concluido').map(s=>`<option value="${s.key}" ${s.key===t.status?'selected':''}>${s.label}</option>`).join('')}
              <option value="concluido" ${(t.status==='concluido' && !t.resultado)?'selected':''}>⚠ Concluído — sem resultado</option>
              <option value="concluido_procedente" ${(t.status==='concluido' && t.resultado==='procedente')?'selected':''}>✅ Concluído — Procedente</option>
              <option value="concluido_improcedente" ${(t.status==='concluido' && t.resultado==='improcedente')?'selected':''}>❌ Concluído — Improcedente</option>
            </select>
          </div>
          <div class="card-actions">
            ${t.status!=='concluido'?`<button class="btn btn-done" data-action="concluir" data-id="${t.id}">✓ Concluir</button>`:''}
            <button class="btn btn-danger" data-action="excluir" data-id="${t.id}">Excluir</button>
          </div>
        </div>
      </div>`;
  }

  function escapeHtml(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }

  function render(){
    renderSummary(); renderTipos(); renderTabs(); renderList(); renderGearDot();
  }

  function renderGearDot(){
    const ultimo = localStorage.getItem(LAST_BACKUP_KEY);
    let precisa = false;
    if(tickets.length > 0){
      if(!ultimo) precisa = true;
      else {
        const dias = Math.floor((Date.now() - new Date(ultimo).getTime()) / 86400000);
        precisa = dias >= DIAS_LEMBRETE_BACKUP;
      }
    }
    $('#gearDot').classList.toggle('show', precisa);
  }

  // ---- eventos globais (delegação) ----
  let lastTapId = null, lastTapTime = 0, tapTimer = null;

  document.addEventListener('click', (e)=>{
    const toggle = e.target.closest('[data-toggle]');
    if(toggle){
      const id = toggle.dataset.toggle;
      const agora = Date.now();
      if(lastTapId === id && (agora - lastTapTime) < 320){
        // toque duplo — marca como concluído sem abrir o card
        clearTimeout(tapTimer);
        lastTapId = null;
        const t = tickets.find(x=>x.id===id);
        if(t && t.status !== 'concluido'){
          updateTicket(id, {status:'concluido'});
          showToast('✓ Concluído com toque duplo');
        }
        return;
      }
      lastTapId = id; lastTapTime = agora;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(()=>{
        openCardId = openCardId===id ? null : id; render();
      }, 300);
      return;
    }

    const actionBtn = e.target.closest('[data-action]');
    if(actionBtn){
      const id = actionBtn.dataset.id;
      if(actionBtn.dataset.action==='concluir'){
        activeTab = 'concluido'; activeResultado = 'todos'; modoGeral=false; modoPorGrupo=false; modoAtencao=false;
        updateTicket(id, {status:'concluido'});
      }
      if(actionBtn.dataset.action==='excluir'){
        openConfirmSheet('Excluir chamado', 'Tem certeza que quer excluir este chamado do quadro? Essa ação não pode ser desfeita.', '🗑 Excluir', ()=>deleteTicket(id));
      }
      return;
    }

    const clearBtn = e.target.closest('[data-clearfield]');
    if(clearBtn){
      const id = clearBtn.dataset.id, field = clearBtn.dataset.clearfield;
      updateTicket(id, {[field]: ''});
      return;
    }
  });

  // ---- arrastar o card lateralmente pra mudar de etapa (sem abrir) ----

  document.addEventListener('change', (e)=>{
    const f = e.target.closest('[data-field]');
    if(!f) return;
    const id = f.dataset.id, field = f.dataset.field;
    if(f.type === 'checkbox'){
      if(field === 'aguardandoChat'){
        updateTicket(id, { aguardandoChat: f.checked, aguardandoChatDesde: f.checked ? now() : '' });
      } else {
        updateTicket(id, {[field]: f.checked});
      }
      return;
    }
    if(field==='status-resultado'){
      let novoStatus, novoResultado;
      if(f.value==='concluido'){ novoStatus='concluido'; novoResultado=''; }
      else if(f.value==='concluido_procedente'){ novoStatus='concluido'; novoResultado='procedente'; }
      else if(f.value==='concluido_improcedente'){ novoStatus='concluido'; novoResultado='improcedente'; }
      else { novoStatus=f.value; novoResultado=''; }

      if(novoStatus==='concluido'){
        activeTab = 'concluido'; activeResultado = 'todos'; modoGeral=false; modoPorGrupo=false; modoAtencao=false;
      } else {
        openCardId = null;
      }
      updateTicket(id, {status:novoStatus, resultado:novoResultado});
    }
    else updateTicket(id, {[field]: f.value});
  });

  $('#search').addEventListener('input', (e)=>{ searchTerm = e.target.value; renderList(); });

  // ---- novo chamado (sheet) ----

      <div class="field"><label>Tipo</label>
        <select id="f-tipo">
          ${TIPOS.map(tp=>`<option value="${tp.key}" ${tp.key===activeTipo?'selected':''}>${tp.label}</option>`).join('')}
        </select>

      <div class="row2">
        <div class="field"><label>Grupo</label>
          <select id="f-grupo">

          </select>

        <div class="field"><label>Status da tinta</label>

  // ---- confirmação própria (o confirm() nativo do navegador não funciona
  // quando o app está instalado na Tela de Início do iPhone) ----
  function openConfirmSheet(titulo, mensagem, labelConfirmar, onConfirmar){
    $('#sheet').innerHTML = `
      <h2>${escapeHtml(titulo)}</h2>

  // ---- backup / restauração ----
  function fmtDataHora(iso){
    if(!iso) return 'nunca';
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  }

  function openBackupSheet(aba){
    aba = aba || 'exportar';
    const ultimoBackup = localStorage.getItem(LAST_BACKUP_KEY);
    $('#sheet').innerHTML = `
      <h2>Backup do quadro</h2>
      <div class="backup-tabs">
        <div class="backup-tab ${aba==='exportar'?'active':''}" data-btab="exportar">⬆️ Fazer backup</div>
        <div class="backup-tab ${aba==='importar'?'active':''}" data-btab="importar">⬇️ Restaurar</div>
      </div>
      <div id="backupContent"></div>
      <div class="sheet-actions">
        <button class="btn btn-ghost" id="closeBackup" style="flex:1;">Fechar</button>
      </div>
    `;
    $('#overlay').classList.remove('hidden');
    $('#closeBackup').onclick = closeSheet;
    $('#sheet').querySelectorAll('.backup-tab').forEach(el=>{
      el.addEventListener('click', ()=> openBackupSheet(el.dataset.btab));
    });

    const content = $('#backupContent');
    if(aba==='exportar'){
      const json = JSON.stringify({ versao:1, geradoEm: now(), tickets }, null, 2);
      content.innerHTML = `
        <p class="small-note">Isso gera uma cópia de tudo que está cadastrado (${tickets.length} chamado${tickets.length===1?'':'s'}). Guarde esse texto em algum lugar seguro (ex: app Notas) — se o celular for formatado ou o link mudar, você usa isso pra trazer tudo de volta.</p>
        <textarea class="backup-textarea" id="exportBox" readonly>${escapeHtml(json)}</textarea>
        <div class="sheet-actions">
          <button class="btn btn-primary" id="btnCopiar" style="flex:1;">📋 Copiar texto</button>
          <button class="btn btn-ghost" id="btnBaixar" style="flex:1;">⬇️ Baixar arquivo</button>
        </div>
        <p class="small-note">Último backup feito: <b>${fmtDataHora(ultimoBackup)}</b></p>
      `;
      $('#btnCopiar').onclick = async ()=>{
        try{
          await navigator.clipboard.writeText(json);
          marcarBackupFeito();
          showToast('Copiado! Cole em algum lugar seguro.');
        }catch(e){
          const box = $('#exportBox'); box.focus(); box.select();
          try{ document.execCommand('copy'); marcarBackupFeito(); showToast('Copiado!'); }
          catch(e2){ showToast('Não consegui copiar — selecione o texto manualmente.'); }
        }
      };
      $('#btnBaixar').onclick = ()=>{
        try{
          const blob = new Blob([json], {type:'application/json'});
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'backup-chamados-vidanova-' + todayStr() + '.json';
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          URL.revokeObjectURL(url);
          marcarBackupFeito();
          showToast('Arquivo baixado!');
        }catch(e){ showToast('Não consegui baixar — tente "Copiar texto".'); }
      };
    } else {
      content.innerHTML = `
        <p class="small-note">Cole aqui o texto de um backup salvo anteriormente, ou escolha o arquivo .json baixado. Isso <b>substitui</b> os chamados atuais do quadro pelos do backup.</p>
        <label class="backup-file-btn">📁 Escolher arquivo de backup
          <input type="file" id="fileImport" accept=".json,application/json" style="display:none;">
        </label>
        <textarea class="backup-textarea" id="importBox" placeholder="Cole aqui o conteúdo do backup..."></textarea>
        <div class="sheet-actions">
          <button class="btn btn-done" id="btnRestaurar" style="flex:1;">Restaurar chamados</button>
        </div>
      `;
      $('#fileImport').addEventListener('change', (e)=>{
        const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = (ev)=>{ $('#importBox').value = ev.target.result; };
        reader.readAsText(file);
      });
      $('#btnRestaurar').onclick = ()=>{
        const raw = $('#importBox').value.trim();
        if(!raw){ showToast('Cole ou escolha um backup primeiro.'); return; }
        let parsed;
        try{ parsed = JSON.parse(raw); }
        catch(e){ showToast('Esse texto não parece um backup válido.'); return; }
        const lista = Array.isArray(parsed) ? parsed : parsed.tickets;
        if(!Array.isArray(lista)){ showToast('Esse texto não parece um backup válido.'); return; }
        openConfirmSheet('Restaurar backup',
          `Isso vai substituir os chamados atuais (${tickets.length}) pelos ${lista.length} do backup. Continuar?`,
          '⬇️ Restaurar', ()=>{
            tickets = lista;
            tickets.forEach(t=>{
              if(!t.tipo) t.tipo='unidade'; if(!t.grupo) t.grupo=''; if(!t.bloco) t.bloco=''; if(!t.resultado) t.resultado='';
              if(!t.dataPrevista) t.dataPrevista=''; if(!t.tintaTipo) t.tintaTipo=''; if(!t.tintaStatus) t.tintaStatus='';
              if(t.aguardandoChat === undefined) t.aguardandoChat = false;
              if(t.aguardandoChatDesde === undefined) t.aguardandoChatDesde = '';
              if(t.nota === undefined) t.nota = '';
              if(!t.dataVistoria) t.dataVistoria='';
            });
            save(); activeTipo='unidade'; activeTab='aguardando'; render();
            showToast('Backup restaurado!');
          });
      };
    }
  }
  function openReport(){
    // no modo "instalado na Tela de Início" o Imprimir do iPhone não funciona, e tentar
    // abrir o Safari por dentro do app também não funciona nesse tipo de instalação —
    // então copiamos o link e damos o passo a passo pra abrir manualmente
    const rodandoInstalado = window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    if(rodandoInstalado){
      $('#reportToolbar').innerHTML = `
        <button class="btn btn-ghost" id="btnFecharRelatorio">← Voltar</button>
        <button class="btn btn-done" id="btnCopiarLinkRelatorio" style="flex:1;">📋 Copiar link do relatório</button>
      `;
      $('#reportHint').innerHTML = `Esse app instalado não consegue abrir o Safari nem imprimir por conta própria — é uma trava do iPhone, não tem jeito de contornar por dentro do app. O caminho é: <b>1)</b> toque no botão acima pra copiar o link · <b>2)</b> saia desse app (deslize pra cima) · <b>3)</b> abra o Safari · <b>4)</b> toque e segure na barra de endereço → <b>Colar e Acessar</b> · <b>5)</b> quando a página abrir, toque em Compartilhar → Imprimir → belisque a prévia com dois dedos → Compartilhar/Salvar em Arquivos.`;
    } else {
      $('#reportToolbar').innerHTML = `
        <button class="btn btn-ghost" id="btnFecharRelatorio">← Voltar</button>
        <button class="btn btn-done" id="btnImprimirRelatorio">🖨 Imprimir / Salvar PDF</button>
      `;
      $('#reportHint').innerHTML = '';
      $('#reportHint').style.display = 'none';
    }
    $('#btnFecharRelatorio').addEventListener('click', ()=>{ $('#reportView').classList.remove('show'); });
    $('#btnImprimirRelatorio') && $('#btnImprimirRelatorio').addEventListener('click', ()=>{ window.print(); });
    $('#btnCopiarLinkRelatorio') && $('#btnCopiarLinkRelatorio').addEventListener('click', async ()=>{
      const link = location.href;
      try{
        await navigator.clipboard.writeText(link);
        showToast('Link copiado! Agora saia do app e cole no Safari.');
      }catch(e){
        const ta = document.createElement('textarea');
        ta.value = link; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.focus(); ta.select();
        try{ document.execCommand('copy'); showToast('Link copiado! Agora saia do app e cole no Safari.'); }
        catch(e2){ showToast('Não consegui copiar automaticamente.'); }
        document.body.removeChild(ta);
      }
    });

    const logoSrc = document.querySelector('.brand-logo').src;
    const agora = new Date();
    const dataGeracao = agora.toLocaleDateString('pt-BR') + ' às ' + agora.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
    const total = tickets.length;

    let html = `
      <div class="rep-header">
        <img src="${logoSrc}" alt="Vida Nova">
        <div class="t">Relatório de Chamados — Cooperativa Vida Nova</div>
      </div>
      <div class="rep-sub">Gerado em ${dataGeracao}</div>
      <div class="rep-totais">
        <span>${total} chamados no total</span>
        ${TIPOS.map(tp=>`<span>${tickets.filter(t=>t.tipo===tp.key).length} ${tp.label}</span>`).join('')}
      </div>
    `;

    TIPOS.forEach(tp=>{
      const doTipo = tickets.filter(t=>t.tipo===tp.key);
      html += `<div class="rep-tipo-title">${tp.label} (${doTipo.length})</div>`;
      if(doTipo.length===0){ html += `<div class="rep-empty">Nenhum chamado.</div>`; return; }
      STAGES.forEach(s=>{
        const doStatus = doTipo.filter(t=>t.status===s.key);
        if(doStatus.length===0) return;
        html += `<div class="rep-status-title">${s.label} — ${doStatus.length}</div>`;

        // sub-agrupar por Grupo, e dentro do grupo por Bloco
        const porGrupo = {};
        GRUPOS.forEach(g=>porGrupo[g]=[]);
        porGrupo['__sem'] = [];
        doStatus.forEach(t=>{
          const g = GRUPOS.includes(t.grupo) ? t.grupo : '__sem';
          porGrupo[g].push(t);
        });
        [...GRUPOS, '__sem'].forEach(g=>{
          const arr = porGrupo[g];
          if(!arr || arr.length===0) return;
          const nomeGrupo = g==='__sem' ? 'Sem grupo definido' : 'Grupo ' + g.replace('G','');
          html += `<div class="rep-grupo-title">${nomeGrupo} <span>${arr.length}</span></div>`;

          const porBloco = {};
          BLOCOS.forEach(b=>porBloco[b]=[]);
          porBloco['__semB'] = [];
          arr.forEach(t=>{
            const b = BLOCOS.includes(t.bloco) ? t.bloco : '__semB';
            porBloco[b].push(t);
          });
          [...BLOCOS, '__semB'].forEach(b=>{
            const arrB = porBloco[b];
            if(!arrB || arrB.length===0) return;
            const nomeBloco = b==='__semB' ? 'Sem bloco' : 'Bloco ' + b;
            html += `<div class="rep-bloco-title">${nomeBloco}</div>`;
            arrB.sort((x,y)=> new Date(x.atualizadoEm) - new Date(y.atualizadoEm));
            arrB.forEach(t=>{
              const usaVistoria = (t.status === 'aguardando' || t.status === 'vistoria');
              const dataRelevante = usaVistoria ? t.dataVistoria : t.dataPrevista;
              const dataTxt = dataRelevante ? `<span class="rep-data">${usaVistoria?'vistoria':'prev. finalização'}: ${fmtDateOnly(dataRelevante)}</span>` : '';
              const tintaInfo = TINTA_STATUS.find(x=>x.key===t.tintaStatus);
              const tinta = t.tintaTipo ? `<span class="rep-tinta-mini">🎨 ${t.tintaTipo==='padrao'?'Padrão':'Proprietário'}${tintaInfo?' · '+tintaInfo.label:''}</span>` : '';
              html += `<div class="rep-row">
                <b>${t.numero?'#'+escapeHtml(t.numero):'—'}</b>
                <span class="rt">${escapeHtml(t.titulo)}${t.local?(' — '+escapeHtml(t.local)):''}</span>
                <span class="rm">${dataTxt}${tinta}</span>
              </div>`;
            });
          });
        });
      });
    });

    $('#reportContent').innerHTML = html;
    $('#reportView').classList.add('show');
  }

  function marcarBackupFeito(){ localStorage.setItem(LAST_BACKUP_KEY, now()); }
  $('#btnBackup').addEventListener('click', ()=>openBackupSheet('exportar'));
  $('#btnRelatorio').addEventListener('click', openReport);
  window.addEventListener('beforeprint', ()=>{ $('#reportView').classList.add('printing'); });
  window.addEventListener('afterprint', ()=>{ $('#reportView').classList.remove('printing'); });

  load();
})();
</script>
</body>
